[package]
name         = "todo-grpc"
description  = "The example's todo domain: it owns the database and knows nothing about HTTP."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish                = false
build      = "build.rs"

[lib]
name = "todo_grpc"
path = "src/lib.rs"

[dependencies]
toolbox         = { workspace = true, features = ["db", "grpc", "auth", "schedule"] }

diesel     = { workspace = true, features = ["r2d2", "sqlite", "chrono", "returning_clauses_for_sqlite_3_35"] }
# Required by `toolbox::db::embed_migrations!`, whose expansion names it.
diesel_migrations = { workspace = true }
chrono     = { workspace = true, features = ["clock", "std"] }
clap       = { workspace = true, features = ["derive", "env"] }
cloudevents-sdk = { workspace = true }
prost      = { workspace = true }
tonic-prost = { workspace = true }
thiserror  = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tokio-stream = { workspace = true }
tonic      = { workspace = true }
tower      = { workspace = true }
tracing    = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }
toolbox           = { workspace = true, features = ["grpc"] }

[lints]
workspace = true
