[package]
name         = "todo-web"
description  = "The example's HTTP gateway: it owns authentication and calls the backend."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish                = false
autotests    = false
autoexamples = false

[lib]
name = "todo_web"
path = "src/lib.rs"

# An example rather than a second binary: it is a tool that prints a file, not
# a process anybody deploys.
[[example]]
name = "dump-openapi"
path = "examples/dump_openapi.rs"

[[example]]
name = "seed-password"
path = "examples/hash_password.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
toolbox         = { workspace = true, features = ["web", "grpc"] }
todo-grpc    = { path = "../grpc/todo" }

async-trait = { workspace = true }
axum       = { workspace = true }
clap       = { workspace = true, features = ["derive", "env"] }
futures-core = { workspace = true }
garde      = { workspace = true, features = ["derive"] }
secrecy    = { workspace = true }
utoipa     = { workspace = true, features = ["axum_extras", "macros"] }
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio      = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tokio-stream = { workspace = true }
tonic      = { workspace = true }
tower      = { workspace = true }
tracing    = { workspace = true }

[dev-dependencies]
toolbox-test   = { workspace = true, features = ["db", "web", "grpc"] }
cloudevents-sdk = { workspace = true }
diesel       = { workspace = true, features = ["r2d2", "sqlite", "chrono", "returning_clauses_for_sqlite_3_35"] }
tempfile     = { workspace = true }
tokio        = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
rpassword    = { workspace = true }

[lints]
workspace = true
