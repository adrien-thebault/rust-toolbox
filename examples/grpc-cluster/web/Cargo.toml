[package]
name         = "example-web"
description  = "The example's HTTP gateway: it owns authentication and calls the backend."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish                = false
autotests    = false
autoexamples = false

[lib]
name = "example_web"
path = "src/lib.rs"

# An example rather than a second binary: it is a tool that prints a file, not
# a process anybody deploys.
[[example]]
name = "dump-openapi"
path = "examples/dump_openapi.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
toolbox-core    = { workspace = true }
toolbox-cluster = { workspace = true }
toolbox-auth    = { workspace = true, features = ["password"] }
toolbox-web     = { workspace = true, features = ["rate-limit", "openapi", "auth-router"] }
toolbox-grpc    = { workspace = true }
toolbox-server  = { workspace = true, features = ["clap"] }
example-todo    = { path = "../grpc/todo" }

async-trait = { workspace = true }
axum       = { workspace = true }
clap       = { workspace = true, features = ["derive", "env"] }
garde      = { workspace = true, features = ["derive"] }
secrecy    = { workspace = true }
utoipa     = { workspace = true, features = ["axum_extras", "macros"] }
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror  = { workspace = true }
tokio      = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net"] }
tonic      = { workspace = true }

[dev-dependencies]
toolbox-test   = { workspace = true, features = ["db", "web", "grpc"] }
toolbox-db     = { workspace = true, features = ["chrono"] }
diesel       = { workspace = true, features = ["r2d2", "sqlite", "chrono", "returning_clauses_for_sqlite_3_35"] }
tempfile     = { workspace = true }
tokio        = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
