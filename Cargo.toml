[workspace]
resolver = "3"
members  = ["crates/*"]
# `incubator/` is deliberately absent: those crates carry their own
# `[workspace]` table, so they are not built, tested or linted here.
# See incubator/README.md.

[workspace.package]
version      = "0.2.0"
edition      = "2024"
rust-version = "1.88"   # floor set by tonic 0.14.6
license      = "MIT"
repository   = "https://github.com/adrien-thebault/rust-toolbox"
authors      = ["Adrien Thébault"]
publish      = false    # never crates.io

[workspace.dependencies]
# internal crates are added by the work package that creates each one.
toolbox-core   = { version = "0.2.0", path = "crates/toolbox-core" }
toolbox-server = { version = "0.2.0", path = "crates/toolbox-server" }
toolbox-db     = { version = "0.2.0", path = "crates/toolbox-db" }
toolbox-macros = { version = "0.2.0", path = "crates/toolbox-macros" }
toolbox-cluster = { version = "0.2.0", path = "crates/toolbox-cluster" }
toolbox-auth   = { version = "0.2.0", path = "crates/toolbox-auth" }
toolbox-web    = { version = "0.2.0", path = "crates/toolbox-web" }
toolbox-grpc   = { version = "0.2.0", path = "crates/toolbox-grpc" }
toolbox-test   = { version = "0.2.0", path = "crates/toolbox-test" }

# external crates: ONE version per crate, workspace-wide.
serde      = { version = "1.0" }
serde_json = { version = "1.0" }
thiserror  = { version = "2.0" }
http       = { version = "1.0" }
http-body  = { version = "1.0" }
http-body-util = { version = "0.1" }
tower      = { version = "0.5" }
tower-http = { version = "0.7" }
tokio      = { version = "1" }
tracing    = { version = "0.1" }
pin-project-lite = { version = "0.2" }
uuid       = { version = "1" }
# Secrets and jitter take bytes straight from the OS source rather than
# borrowing a UUID for its randomness.
getrandom  = { version = "0.3" }
ipnet      = { version = "2.12" }
rpassword  = { version = "7" }
bytes      = { version = "1" }
diesel     = { version = "2.3", default-features = false }
diesel_migrations = { version = "2.3" }
chrono     = { version = "0.4", default-features = false }
croner     = { version = "3" }
metrics    = { version = "0.24" }
time       = { version = "0.3" }
clap       = { version = "4" }
tempfile   = { version = "3" }
syn        = { version = "2" }
quote      = { version = "1" }
proc-macro2 = { version = "1" }
trybuild   = { version = "1" }
tokio-stream = { version = "0.1" }
futures-core = { version = "0.3" }
futures-util = { version = "0.3" }
futures-executor = { version = "0.3" }
async-trait  = { version = "0.1" }
moka         = { version = "0.12" }
cloudevents-sdk = { version = "0.9" }
tracing-subscriber = { version = "0.3" }
axum         = { version = "0.8" }
axum-extra   = { version = "0.12" }
garde        = { version = "0.23" }
utoipa       = { version = "5.5" }
utoipa-axum  = { version = "0.2" }
utoipa-scalar = { version = "0.3" }
tower_governor = { version = "0.8" }
governor     = { version = "0.10" }
tonic        = { version = "0.14" }
tonic-types  = { version = "0.14" }
tonic-health = { version = "0.14" }
tonic-reflection = { version = "0.14" }
tonic-prost-build = { version = "0.14" }
prost        = { version = "0.14" }
tonic-prost  = { version = "0.14" }
backon       = { version = "1.6" }
secrecy      = { version = "0.10" }
axum-test    = { version = "21" }
wiremock     = { version = "0.6" }
object_store = { version = "0.14" }
infer        = { version = "0.22" }
blake3       = { version = "1.8" }
image        = { version = "0.25" }
jsonwebtoken = { version = "11" }
argon2       = { version = "0.5.3" }
password-hash = { version = "0.5" }
openidconnect = { version = "4", default-features = false }
url          = { version = "2" }
reqwest      = { version = "0.12", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code  = "forbid"

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
