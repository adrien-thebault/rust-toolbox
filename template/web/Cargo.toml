[package]
name        = "{{project-name}}-web"
description = "The HTTP gateway: it owns authentication and calls the domains."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
autoexamples = false

[[bin]]
name = "gateway"
path = "src/main.rs"

# A tool that prints the OpenAPI spec, not a process anybody deploys.
[[example]]
name = "dump-openapi"
path = "examples/dump_openapi.rs"

[[example]]
name = "seed-password"
path = "examples/hash_password.rs"

[dependencies]
toolbox         = { workspace = true, features = ["web", "grpc"] }
todo            = { package = "{{project-name}}-todo", path = "../grpc/todo" }

async-trait = { workspace = true }
axum        = { workspace = true }
clap        = { workspace = true }
futures-core = { workspace = true }
garde       = { workspace = true }
secrecy     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true }
tokio-stream = { workspace = true }
tonic       = { workspace = true }
tower       = { workspace = true }
tracing     = { workspace = true }
utoipa      = { workspace = true }

[dev-dependencies]
rpassword = { workspace = true }

[lints]
workspace = true
