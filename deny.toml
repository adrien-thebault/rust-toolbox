# Every entry below is reviewed and carries a reason. An entry with no comment
# is a bug: the point of this file is that somebody looked, not that the build
# is quiet.

[bans]
multiple-versions = "deny"

# Duplicates we cannot fix from here, because they are two upstream crates
# pinning different majors of a shared dependency. Each names who pulls what.
skip = [
  # reqwest 0.13 uses base64 0.23 while the existing HTTP and JWT ecosystem
  # still pins 0.22. Both are memory-safe encoding libraries.
  { crate = "base64@0.23.1" },

  # reqwest (captcha, oidc) pins tower-http 0.6; the toolbox uses 0.7. This is
  # NOT the bug the ban exists for - that was a consumer declaring tower-http
  # itself alongside the toolbox's - and it disappears without the captcha and
  # oidc features.
  { crate = "tower-http@0.6.11" },

  # rand 0.8 comes from jsonwebtoken/rsa, 0.9 from governor, and 0.10 from
  # axum-test multipart support.
  { crate = "rand@0.8.8" }, { crate = "rand@0.9.5" },
  { crate = "rand_core@0.6.4" }, { crate = "rand_core@0.9.5" },
  { crate = "rand_chacha@0.3.1" },
  { crate = "getrandom@0.2.17" }, { crate = "getrandom@0.3.4" },
  { crate = "r-efi@5.3.0" },

  # hashbrown 0.14 comes from dashmap/governor, 0.15 from petgraph/prost-build,
  # 0.16 from governor, and 0.17 from indexmap.
  { crate = "hashbrown@0.14.5" }, { crate = "hashbrown@0.15.5" },
  { crate = "hashbrown@0.16.1" },
  # hashbrown 0.15 and 0.16 use different foldhash majors.
  { crate = "foldhash@0.1.5" },

  # thiserror 1 via older transitive crates; the workspace itself is on 2.
  { crate = "thiserror@1.0.69" }, { crate = "thiserror-impl@1.0.69" },

  # darling 0.20 comes from croner/derive_builder; 0.21 comes from Diesel.
  { crate = "darling@0.20.11" },
  { crate = "darling_core@0.20.11" },
  { crate = "darling_macro@0.20.11" },

  # A proc-macro crate's syn version is invisible at runtime; winnow is used by
  # the build-time TOML parsers.
  { crate = "syn@2.0.119" },
  { crate = "winnow@0.7.15" },
  # cpufeatures 0.2 is used by runtime cryptography; 0.3 comes from
  # rand 0.10/chacha20 through axum-test.
  { crate = "cpufeatures@0.2.17" },

  # diesel_migrations uses toml 0.9 while the compile-test-only trybuild uses
  # toml 1.1. Neither version crosses into a shipped crate's public API.
  { crate = "toml_datetime@0.7.5" },

]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  # foldhash, via hashbrown. Permissive.
  "Zlib",
  # webpki-roots, via rustls. The Mozilla root bundle is data, and this is its
  # permissive data licence.
  "CDLA-Permissive-2.0",
]
# cloudevents-sdk sets `license-file` rather than a license expression, so
# cargo-deny reads the file (unmodified Apache 2.0) and warns while accepting
# it. Informational only; a `[[licenses.clarify]]` does not silence it.

[advisories]
ignore = [
  # RSA sidechannel (Marvin Attack). Reachable only through private-key
  # operations - decryption and signing - and nothing here holds an RSA private
  # key. `rsa` is pulled by jsonwebtoken's rust_crypto feature for RS256
  # verification, which `toolbox-auth`'s `jwks` and `public_key` strategies do
  # against a third party's public key - a public-key operation. There is no
  # fixed release. Re-check on every `rsa` release.
  { id = "RUSTSEC-2023-0071", reason = "public-key verification only; no RSA private key exists in this workspace" },

  # `paste` is a proc-macro pulled by utoipa-axum. Unmaintained rather than
  # vulnerable, build-time only, nothing in the shipped binary.
  { id = "RUSTSEC-2024-0436", reason = "build-time proc-macro via utoipa-axum; unmaintained, not vulnerable" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
