[package]
name         = "toolbox-cluster-postgres"
description  = "Shared cluster adapters over PostgreSQL: transactional outbox, key-value store and advisory locks."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish                = false
autotests = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
toolbox-core    = { workspace = true }
toolbox-cluster = { workspace = true }
toolbox-db      = { workspace = true }
# The one place in the workspace that names a backend feature, because these
# adapters are PostgreSQL by definition. See the crate docs.
diesel          = { workspace = true, features = ["r2d2", "postgres", "chrono", "serde_json"] }
diesel_migrations = { workspace = true }
chrono          = { workspace = true, features = ["clock", "std"] }
async-trait     = { workspace = true }
futures-core    = { workspace = true }
serde_json      = { workspace = true }
tokio           = { workspace = true, features = ["rt", "time", "sync"] }
tokio-stream    = { workspace = true }
tracing         = { workspace = true }
uuid            = { workspace = true, features = ["v7"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
cloudevents-sdk = { workspace = true }

[lints]
workspace = true
