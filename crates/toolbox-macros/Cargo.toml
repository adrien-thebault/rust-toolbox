[package]
name         = "toolbox-macros"
description  = "Derive macros for the toolbox: #[derive(Entity)]."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish                = false

[lib]
proc-macro = true

[dependencies]
syn         = { workspace = true, features = ["full", "extra-traits"] }
quote       = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]
trybuild = { workspace = true }
# The ui cases are real entities, so they need everything a consumer has. The
# dev-dependency back onto toolbox-db is a cycle cargo permits.
toolbox-db   = { workspace = true, features = ["chrono"] }
toolbox-core = { workspace = true }
diesel       = { workspace = true, features = ["r2d2", "sqlite", "chrono"] }
chrono       = { workspace = true, features = ["clock", "std"] }

[lints]
workspace = true
