[package]
name         = "toolbox-cluster"
description  = "The multi-replica seam: event bus, key-value store, locks, clock, and a deployment guard."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors.workspace      = true
publish                = false
autotests = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
toolbox-core = { workspace = true }
tokio        = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-stream = { workspace = true, features = ["sync"] }
futures-core = { workspace = true }
async-trait  = { workspace = true }
moka         = { workspace = true, features = ["future"] }
serde        = { workspace = true, features = ["derive"] }
serde_json   = { workspace = true }
thiserror    = { workspace = true }
tracing      = { workspace = true }
uuid         = { workspace = true, features = ["v7"] }
cloudevents-sdk = { workspace = true }
chrono       = { workspace = true, features = ["clock", "std"] }

[dev-dependencies]
tokio         = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
futures-util  = { workspace = true }
cloudevents-sdk = { workspace = true }

[lints]
workspace = true
