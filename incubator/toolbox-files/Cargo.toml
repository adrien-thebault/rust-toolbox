# Its own workspace root, so the toolbox does not build it.
[workspace]

[package]
name         = "toolbox-files"
description  = "File policy, streaming ingest and cache-correct serving, over the toolbox."
version      = "0.2.0"
edition      = "2024"
rust-version = "1.88"
license      = "MIT"
authors      = ["Adrien Thébault"]
publish      = false
autotests    = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[features]
default = []
# The ready-made gRPC service and its wire contract. Off by default: the
# storage logic is usable on its own, and a project writing its own service
# should not pay for tonic.
service = [
  "dep:toolbox-db", "dep:toolbox-grpc", "dep:diesel", "dep:diesel_migrations",
  "dep:chrono", "dep:tonic", "dep:tokio", "dep:tokio-stream", "dep:prost", "dep:tonic-prost",
]
# The multipart-to-gRPC adapters, the only code that needs both transports.
web = ["service", "dep:toolbox-web", "dep:axum"]
# Resized and reformatted variants. Off by default: `image` is a large tree,
# and a project serving only documents has no use for it.
images = ["dep:image"]

[dependencies]
toolbox-core = { path = "../../crates/toolbox-core" }
object_store = { version = "0.14" }
infer        = { version = "0.19" }
blake3       = { version = "1" }
bytes        = { version = "1" }
futures-core = { version = "0.3" }
futures-util = { version = "0.3" }
http         = { version = "1.0" }
serde        = { version = "1.0", features = ["derive"] }
thiserror    = { version = "2.0" }
tracing      = { version = "0.1" }
uuid         = { version = "1", features = ["v7"] }
image        = { version = "0.25", optional = true }
toolbox-db   = { path = "../../crates/toolbox-db", optional = true }
toolbox-grpc = { path = "../../crates/toolbox-grpc", optional = true }
toolbox-web  = { path = "../../crates/toolbox-web", optional = true }
axum         = { version = "0.8", optional = true, features = ["multipart"] }
diesel       = { version = "2.2", optional = true, features = ["r2d2", "chrono"] }
diesel_migrations = { version = "2.2", optional = true }
chrono       = { version = "0.4", optional = true, features = ["clock", "std"] }
tonic        = { version = "0.14", optional = true }
prost        = { version = "0.14", optional = true }
tonic-prost  = { version = "0.14", optional = true }
tokio        = { version = "1", optional = true, features = ["rt", "sync"] }
tokio-stream = { version = "0.1", optional = true }

[build-dependencies]
tonic-prost-build = { version = "0.14" }

[dev-dependencies]
tokio        = { version = "1", features = ["rt-multi-thread", "macros"] }
diesel       = { version = "2.2", features = ["r2d2", "sqlite", "chrono", "returning_clauses_for_sqlite_3_35"] }
toolbox-test = { path = "../../crates/toolbox-test", features = ["db", "grpc"] }
toolbox-files = { path = ".", features = ["service", "web"] }
tempfile     = { version = "3" }

[lints.rust]
missing_docs = "warn"
unsafe_code  = "forbid"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate      = "allow"
