[package]
name        = "{{project-name}}-todo"
description = "The todo domain: it owns the database and knows nothing about HTTP."
version.workspace = true
edition.workspace = true
publish.workspace = true
build       = "build.rs"

[[bin]]
name = "{{project-name}}"
path = "src/main.rs"

[dependencies]
toolbox-core   = { workspace = true }
toolbox-db     = { workspace = true }
toolbox-grpc   = { workspace = true }
toolbox-server = { workspace = true }

chrono     = { workspace = true }
clap       = { workspace = true }
diesel     = { workspace = true }
diesel_migrations = { workspace = true }
prost      = { workspace = true }
thiserror  = { workspace = true }
tokio      = { workspace = true }
tonic      = { workspace = true }
tonic-prost = { workspace = true }
tracing    = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }
toolbox-grpc      = { workspace = true }

[lints]
workspace = true
