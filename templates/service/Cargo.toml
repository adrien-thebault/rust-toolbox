# A workspace, not one crate: a **domain** is a crate under `grpc/`, and a gRPC
# service is a file under that crate's `service/`. Adding a second domain is a
# new directory here and no edit to this file.
[workspace]
resolver = "3"
members  = ["grpc/*"{% if gateway %}, "web"{% endif %}]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Pinned to a tag, never a branch: a branch means the next `cargo update` can
# bring a breaking change nobody chose.
toolbox-core    = { git = "https://github.com/adrien-thebault/rust-toolbox.git", tag = "v0.2.0" }
toolbox-db      = { git = "https://github.com/adrien-thebault/rust-toolbox.git", tag = "v0.2.0", features = ["clap"] }
toolbox-cluster = { git = "https://github.com/adrien-thebault/rust-toolbox.git", tag = "v0.2.0" }
toolbox-schedule = { git = "https://github.com/adrien-thebault/rust-toolbox.git", tag = "v0.2.0" }
toolbox-server  = { git = "https://github.com/adrien-thebault/rust-toolbox.git", tag = "v0.2.0", features = ["clap"] }
toolbox-grpc    = { git = "https://github.com/adrien-thebault/rust-toolbox.git", tag = "v0.2.0" }
# Not behind `gateway`: `AssertedPrincipal` is what a gRPC service checks on
# its own caller, whether or not that caller is this template's own gateway.
toolbox-auth    = { git = "https://github.com/adrien-thebault/rust-toolbox.git", tag = "v0.2.0", features = ["password"] }
{% if gateway %}toolbox-web     = { git = "https://github.com/adrien-thebault/rust-toolbox.git", tag = "v0.2.0", features = ["rate-limit", "auth-router", "openapi", "idempotency", "realtime"] }
{% endif %}
# Declared directly, not through toolbox::deps: their derives emit absolute
# `diesel::` and `serde::` paths.
{% if database == "postgres" %}diesel = { version = "2.3", features = ["r2d2", "chrono", "postgres"] }
{% else %}diesel = { version = "2.3", features = ["r2d2", "chrono", "sqlite", "returning_clauses_for_sqlite_3_35"] }
{% endif %}# Required by `toolbox_db::embed_migrations!`, which expands to a path in it.
diesel_migrations = "2.3"

{% if gateway %}async-trait = "0.1"
axum        = "0.8"
futures-core = "0.3"
garde       = { version = "0.23", features = ["derive"] }
secrecy     = "0.10"
utoipa      = { version = "5.5", features = ["axum_extras", "macros"] }
{% endif %}chrono      = { version = "0.4", features = ["clock", "std"] }
clap        = { version = "4", features = ["derive", "env"] }
cloudevents-sdk = "0.9"
prost       = "0.14"
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
thiserror   = "2.0"
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
tokio-stream = "0.1"
tonic       = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower       = "0.5"
tracing     = "0.1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code  = "forbid"

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
