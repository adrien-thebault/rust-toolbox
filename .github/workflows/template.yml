name: Template

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # A template that is not generated and built is a template that is broken and
  # nobody knows. All four variants, every commit.
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gateway: ["true", "false"]
        database: ["sqlite", "postgres"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy
      # rustfmt from nightly, because the generated rustfmt.toml sets
      # `group_imports`.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2
        with:
          tool: cargo-generate

      - name: Generate
        run: |
          mkdir -p /tmp/generated && cd /tmp/generated
          cargo generate --path "$GITHUB_WORKSPACE/template" \
            --name svc \
            --define "gateway=${{ matrix.gateway }}" \
            --define "database=${{ matrix.database }}" \
            --silent

      # The template pins a released tag, which does not exist for the commit
      # under test. Point it at this checkout so CI verifies the code rather
      # than the last release.
      - name: Point the generated project at this checkout
        run: |
          cd /tmp/generated/svc
          python3 - <<'PY'
          import os, re
          root = os.environ["GITHUB_WORKSPACE"]
          s = open("Cargo.toml").read()
          def f(m):
              name, rest = m.group(1), m.group(2)
              feats = re.search(r'(features\s*=\s*\[[^\]]*\])', rest)
              extra = ", " + feats.group(1) if feats else ""
              return f'{name} = {{ path = "{root}/crates/{name}"{extra} }}'
          s = re.sub(r'^(toolbox(?:-[a-z]+)?)\s*=\s*\{ git = "[^"]+", tag = "[^"]+"(.*?)\}$', f, s, flags=re.M)
          open("Cargo.toml", "w").write(s)
          PY

      # A freshly generated project must pass its own CI, or the first thing a
      # user does is fix the template.
      - name: The generated project passes its own checks
        run: |
          cd /tmp/generated/svc
          # rust-toolchain@nightly ran last, so it is the default here; fmt
          # wants nightly (group_imports), clippy and build want the stable
          # toolchain that carries the clippy component.
          cargo +nightly fmt --all --check
          cargo +stable clippy --workspace --all-targets -- -D warnings
          cargo +stable build --workspace
          # The Dockerfile does `COPY Cargo.lock` with --locked, so the README
          # tells you to build once and commit the result. Assert that works.
          test -f Cargo.lock

      # The gateway variants ship an OpenAPI dumper and the script CI runs on it;
      # prove both produce a spec, the same way the README's first run does.
      - name: The OpenAPI spec generates
        if: matrix.gateway == 'true'
        run: |
          cd /tmp/generated/svc
          ./openapi.sh
          test -s web/openapi.json
