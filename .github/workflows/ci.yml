name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nightly, because `group_imports` is unstable. Nothing else here needs it,
  # and stable `cargo fmt` still produces the right output for everyday editing.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
      - run: cargo test --workspace --all-features

  # The example is the regression test the macros do not otherwise have: a
  # derive with no consumer in the repository is a derive nobody has checked.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
      - run: cargo test -p example-todo -p example-web

  hack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack --feature-powerset --depth 2 check -p toolbox-db -p toolbox-web -p toolbox-auth -p toolbox

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
      - run: cargo check --workspace --all-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
      - run: cargo doc --workspace --all-features --no-deps

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: taiki-e/install-action@v2
        with:
          tool: committed
      - run: committed --no-merge-commit origin/${{ github.base_ref }}..HEAD

  # toolbox-db is generic over the backend, so its cross-backend tests need real
  # servers. They soft-skip when TOOLBOX_TEST_*_URL is unset.
  test-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: toolbox
          POSTGRES_PASSWORD: toolbox
          POSTGRES_DB: toolbox
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U toolbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TOOLBOX_TEST_POSTGRES_URL: postgres://toolbox:toolbox@localhost:5432/toolbox
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev default-libmysqlclient-dev
      - run: cargo test --workspace --all-features

  test-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: toolbox
          MYSQL_DATABASE: toolbox
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -ptoolbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TOOLBOX_TEST_MYSQL_URL: mysql://root:toolbox@127.0.0.1:3306/toolbox
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: arduino/setup-protoc@v3
      - run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev libpq-dev
      - run: cargo test --workspace --all-features
