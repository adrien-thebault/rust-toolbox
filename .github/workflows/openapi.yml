name: OpenAPI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # A route whose schema changed without the committed spec being regenerated
  # fails here, with a diff naming exactly what moved. Stable key ordering in
  # dump_openapi is what makes this work at all.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: ./examples/todo/openapi.sh
      - name: The committed spec is out of date - run examples/todo/openapi.sh and commit the result
        run: git diff --exit-code examples/todo/web/openapi.json
